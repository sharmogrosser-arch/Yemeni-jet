                ]
            }
        ];

        const CATEGORIES = [
            { id: "all", name: "الكل", icon: "grid" },
            { id: "restaurants", name: "مطاعم", icon: "utensils" },
            { id: "grocery", name: "بقالة", icon: "shopping-bag" },
            { id: "clinics", name: "عيادات ومختبرات", icon: "stethoscope" },
            { id: "shipping", name: "خدمات شحن", icon: "truck" },
            { id: "cafes", name: "مقاهي", icon: "coffee" }
        ];

        function App() {
            const [activeTab, setActiveTab] = React.useState('home');
            const [selectedCategory, setSelectedCategory] = React.useState('الكل');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [selectedVendor, setSelectedVendor] = React.useState(null);
            const [showQRModal, setShowQRModal] = React.useState(false);
            const [timer, setTimer] = React.useState(900); // 15 mins countdown
            const [savedVendors, setSavedVendors] = React.useState([1, 3]);

            // Icons render helper
            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, selectedVendor, showQRModal, selectedCategory]);

            // Timer countdown logic for QR Pass
            React.useEffect(() => {
                let interval = null;
                if (showQRModal && timer > 0) {
                    interval = setInterval(() => {
                        setTimer(prev => prev - 1);
                    }, 1000);
                } else if (timer === 0) {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [showQRModal, timer]);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            const toggleFavorite = (id, e) => {
                if (e) e.stopPropagation();
                setSavedVendors(prev => 
                    prev.includes(id) ? prev.filter(vId => vId !== id) : [...prev, id]
                );
            };

            const filteredVendors = VENDORS_DATA.filter(v => {
                const matchesCategory = selectedCategory === 'الكل' || v.category === selectedCategory;
                const matchesSearch = v.name.includes(searchQuery) || v.description.includes(searchQuery) || v.location.includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            return (
                <div className="mobile-screen w-full bg-slate-50 flex flex-col relative overflow-hidden sm:rounded-3xl border-4 border-slate-800">
                    
                    {/* APP TOP HEADER */}
                    <div className="bg-burgundy text-white px-5 pt-6 pb-4 shadow-md rounded-b-2xl z-10 shrink-0">
                        <div className="flex justify-between items-center mb-3">
                            {/* Logo & Location */}
                            <div className="flex items-center gap-2">
                                <div className="w-10 h-10 rounded-full bg-gold flex items-center justify-center text-burgundy font-bold shadow-md">
                                    <i data-lucide="plane" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl font-black text-gold tracking-wide leading-none">Yemeni Jet</h1>
                                    <span className="text-xs text-rose-100 flex items-center gap-1 mt-0.5">
                                        <i data-lucide="map-pin" className="w-3 h-3 text-gold"></i>
                                        القاهرة، مصر
                                    </span>
                                </div>
                            </div>
                            
                            {/* Notification Icon */}
                            <button className="w-10 h-10 rounded-full bg-burgundy-light/60 flex items-center justify-center border border-rose-300/20 text-gold relative">
                                <i data-lucide="bell" className="w-5 h-5"></i>
                                <span className="absolute top-2 right-2 w-2 h-2 bg-gold rounded-full"></span>
                            </button>
                        </div>

                        {/* Welcome Tagline */}
                        <p className="text-xs text-rose-100 mb-3 font-medium">أهلاً وسهلاً، اكتشف الخدمات والخصومات اليمنية القريبة منك</p>

                        {/* Search Bar */}
                        <div className="relative">
                            <input 
                                type="text"
                                placeholder="ابحث عن وجبة، منتج، أو خدمة..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full bg-white text-slate-800 pr-10 pl-4 py-2.5 rounded-xl text-sm outline-none shadow-inner placeholder:text-slate-400 focus:ring-2 focus:ring-gold"
                            />
                            <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute right-3.5 top-3.5"></i>
                        </div>
                    </div>

                    {/* MAIN SCROLLABLE CONTENT AREA */}
                    <div className="flex-1 overflow-y-auto no-scrollbar p-4 space-y-5 pb-24">
                        
                        {/* SCREEN 1: HOME TAB */}
                        {activeTab === 'home' && (
                            <>
                                {/* Categories Horizontal Scroll */}
                                <div className="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
                                    {CATEGORIES.map(cat => (
                                        <button
                                            key={cat.id}
                                            onClick={() => setSelectedCategory(cat.name)}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all shadow-sm flex items-center gap-1.5 ${
                                                selectedCategory === cat.name
                                                    ? 'bg-burgundy text-gold border border-gold/30 shadow'
                                                    : 'bg-white text-slate-600 border border-slate-200/80 hover:bg-slate-100'
                                            }`}
                                        >
                                            {cat.name}
                                        </button>
                                    ))}
                                </div>

                                {/* Banner Promotion */}

                                        <span className="bg-gold text-burgundy font-black text-[10px] px-2 py-0.5 rounded-md uppercase tracking-wider">حصرياً</span>

                                        <p className="text-xs text-rose-100 mt-1">وفر حتى 20% في أزخم المطاعم والخدمات اليمنية في مصر!</p>
                                    </div>
                                    <div className="absolute left-3 -bottom-2 text-gold/20">
                                        <i data-lucide="ticket" className="w-28 h-28"></i>
                                    </div>
                                </div>

                                {/* Featured Vendors List */}
                                <div>
                                    <div className="flex justify-between items-center mb-3">
                                        <h2 className="text-base font-bold text-slate-800 flex items-center gap-1.5">
                                            <i data-lucide="sparkles" className="w-4 h-4 text-gold"></i>
                                            المحلات المميزة
                                        </h2>
                                        <button onClick={() => setActiveTab('explore')} className="text-xs font-bold text-burgundy hover:underline">عرض الكل</button>
                                    </div>

                                    <div className="space-y-4">
                                        {filteredVendors.length > 0 ? (
                                            filteredVendors.map(vendor => (
                                                <div 
                                                    key={vendor.id}
                                                    onClick={() => setSelectedVendor(vendor)}
                                                    className="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-md transition-all cursor-pointer group"
                                                >
                                                    {/* Vendor Image Banner */}

                                                        <img 
                                                            src={vendor.image}

                                                                <i data-lucide="star" className="w-3.5 h-3.5 fill-amber-400 text-amber-400"></i>
                                                                {vendor.rating}

                                                        </div>
                                                    </div>

                                            <div className="text-center py-10 bg-white rounded-2xl border border-dashed border-slate-300">

                                                <p className="text-sm font-bold text-slate-600">لا توجد محلات مطابقة للبحث</p>

                                            </div>
                                        )}
                                    </div>
                                </div>
                            </>
                        )}

                        {/* SCREEN 2: EXPLORE TAB */}
                        {activeTab === 'explore' && (
                            <div className="space-y-4">
                                <h2 className="text-base font-bold text-slate-800">استكشف حسب المناطق والتصنيفات</h2>
                                
                                {/* Location Filter Pills */}

                                    <button className="bg-white text-slate-600 font-medium px-3 py-1.5 rounded-lg text-xs border border-slate-200">فيصل</button>
                                    <button className="bg-white text-slate-600 font-medium px-3 py-1.5 rounded-lg text-xs border border-slate-200">المهندسين</button>
                                    <button className="bg-white text-slate-600 font-medium px-3 py-1.5 rounded-lg text-xs border border-slate-200">الدقي</button>
                                </div>

                                <div className="grid grid-cols-2 gap-3">
                                    {CATEGORIES.filter(c => c.id !== 'all').map(cat => (
                                        <div 
                                            key={cat.id}
                                            onClick={() => {
                                                setSelectedCategory(cat.name);
                                                setActiveTab('home');
                                            }}
                                            className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm hover:border-gold cursor-pointer transition flex flex-col items-center text-center group"
                                        >
                                            <div className="w-12 h-12 rounded-full bg-burgundy-soft text-burgundy flex items-center justify-center mb-2 group-hover:bg-burgundy group-hover:text-gold transition">
                                                <i data-lucide={cat.icon} className="w-6 h-6"></i>
                                            </div>
                                            <span className="text-xs font-bold text-slate-800">{cat.name}</span>
                                            <span className="text-[10px] text-slate-400 mt-0.5">محلات ممتازة</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* SCREEN 3: DEALS TAB */}
                        {activeTab === 'deals' && (
                            <div className="space-y-4">
                                <div className="bg-gold/10 border border-gold/40 p-4 rounded-2xl text-center">
                                    <i data-lucide="percent" className="w-8 h-8 text-gold-dark mx-auto mb-1"></i>
                                    <h3 className="font-extrabold text-burgundy text-sm">أقوى عروض اليوم الحصرية</h3>
                                    <p className="text-xs text-slate-600 mt-0.5">خصومات تصل إلى 20% لفترة محدودة</p>
                                </div>

                                {VENDORS_DATA.map(vendor => (
                                    <div key={vendor.id} className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                                        <div className="flex items-center gap-3">
                                            <img src={vendor.image} className="w-14 h-14 rounded-xl object-cover" />
                                            <div>
                                                <h4 className="font-bold text-xs text-slate-800">{vendor.name}</h4>
                                                <span className="text-[10px] text-slate-500">{vendor.location}</span>
                                                <div className="text-xs font-black text-burgundy mt-1">{vendor.discount}</div>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => setSelectedVendor(vendor)}
                                            className="bg-burgundy text-gold text-xs px-3 py-1.5 rounded-xl font-bold shadow-sm"
                                        >
                                            احصل عليه
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* SCREEN 4: SAVED / FAVORITES TAB */}
                        {activeTab === 'saved' && (
                            <div className="space-y-3">
                                <h2 className="text-base font-bold text-slate-800">المحلات المفضلة لديك</h2>
                                {VENDORS_DATA.filter(v => savedVendors.includes(v.id)).length > 0 ? (
                                    VENDORS_DATA.filter(v => savedVendors.includes(v.id)).map(vendor => (
                                        <div key={vendor.id} onClick={() => setSelectedVendor(vendor)} className="bg-white p-3 rounded-2xl border border-slate-100 flex items-center justify-between cursor-pointer">
                                            <div className="flex items-center gap-3">
                                                <img src={vendor.image} className="w-12 h-12 rounded-xl object-cover" />
                                                <div>
                                                    <h4 className="font-bold text-xs text-slate-800">{vendor.name}</h4>
                                                    <span className="text-[10px] text-slate-400">{vendor.category}</span>
                                                </div>
                                            </div>
                                            <button onClick={(e) => toggleFavorite(vendor.id, e)} className="text-rose-500 p-2">
                                                <i data-lucide="trash-2" className="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    ))
                                ) : (
                                    <div className="text-center py-12 text-slate-400">
                                        <i data-lucide="heart-off" className="w-10 h-10 mx-auto mb-2 text-slate-300"></i>
                                        <p className="text-xs font-bold">لم تقم بإضافة أي محلات للمفضلة بعد</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* SCREEN 5: PROFILE TAB */}
                        {activeTab === 'profile' && (
                            <div className="space-y-4">
                                <div className="bg-white p-4 rounded-2xl border border-slate-100 text-center">
                                    <div className="w-16 h-16 rounded-full bg-burgundy text-gold font-extrabold text-xl flex items-center justify-center mx-auto mb-2 shadow-md">
                                        أي
                                    </div>
                                    <h3 className="font-bold text-slate-800 text-sm">أحمد اليمني</h3>
                                    <p className="text-xs text-slate-400">عضو VIP - يمني جيت</p>
                                    <span className="inline-block bg-amber-100 text-amber-800 text-[10px] font-bold px-2.5 py-0.5 rounded-full mt-2">اشتراك فعال</span>
                                </div>

                                <div className="bg-white rounded-2xl border border-slate-100 overflow-hidden divide-y divide-slate-100 text-xs font-bold text-slate-700">
                                    <div className="p-3.5 flex items-center justify-between cursor-pointer hover:bg-slate-50">
                                        <span className="flex items-center gap-2">
                                            <i data-lucide="ticket" className="w-4 h-4 text-burgundy"></i>
                                            كروت الخصم المفعلة
                                        </span>
                                        <i data-lucide="chevron-left" className="w-4 h-4 text-slate-400"></i>
                                    </div>
                                    <div className="p-3.5 flex items-center justify-between cursor-pointer hover:bg-slate-50">
                                        <span className="flex items-center gap-2">
                                            <i data-lucide="globe" className="w-4 h-4 text-burgundy"></i>
                                            اللغة / Language
                                        </span>
                                        <span className="text-[11px] text-slate-400">العربية</span>
                                    </div>
                                    <div className="p-3.5 flex items-center justify-between cursor-pointer hover:bg-slate-50">
                                        <span className="flex items-center gap-2">
                                            <i data-lucide="help-circle" className="w-4 h-4 text-burgundy"></i>
                                            المساعدة والدعم الفني
                                        </span>
                                        <i data-lucide="chevron-left" className="w-4 h-4 text-slate-400"></i>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* VENDOR DETAIL MODAL / FULL SCREEN VIEW */}
                    {selectedVendor && (
                        <div className="absolute inset-0 bg-white z-30 overflow-y-auto no-scrollbar flex flex-col">
                            {/* Header Bar */}
                            <div className="relative h-60 bg-slate-800">
                                <img src={selectedVendor.image} className="w-full h-full object-cover" />
                                <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-black/40"></div>
                                
                                <button 
                                    onClick={() => setSelectedVendor(null)}
                                    className="absolute top-4 right-4 w-9 h-9 rounded-full bg-white/80 backdrop-blur-md flex items-center justify-center text-slate-800 font-bold shadow-md"
                                >
                                    <i data-lucide="arrow-right" className="w-5 h-5"></i>
                                </button>

                                <div className="absolute bottom-4 right-4 left-4 text-white">
                                    <span className="bg-gold text-burgundy text-[10px] font-black px-2.5 py-0.5 rounded-md">
                                        {selectedVendor.category}
                                    </span>
                                    <h2 className="text-lg font-black mt-1 text-white">{selectedVendor.name}</h2>
                                    <p className="text-xs text-slate-200 flex items-center gap-1 mt-0.5">
                                        <i data-lucide="map-pin" className="w-3 h-3 text-gold"></i>
                                        {selectedVendor.address}
                                    </p>
                                </div>
                            </div>

                            {/* Detail Content */}
                            <div className="p-4 space-y-4 flex-1 pb-20">
                                {/* Offer Highlight Box */}
                                <div className="bg-burgundy-soft border border-burgundy/20 p-3.5 rounded-2xl flex items-center justify-between shadow-sm">
                                    <div>
                                        <span className="text-[10px] font-bold text-burgundy uppercase">الخصم الحصري</span>
                                        <h4 className="text-sm font-black text-burgundy">{selectedVendor.discount} على جميع الطلبات</h4>
                                    </div>
                                    <button 
                                        onClick={() => {
                                            setShowQRModal(true);
                                            setTimer(900);
                                        }}
                                        className="bg-burgundy text-gold font-bold text-xs px-4 py-2 rounded-xl shadow-md hover:bg-burgundy-dark transition"
                                    >
                                        احصل على الخصم الآن
                                    </button>
                                </div>

                                {/* Description */}
                                <div>
                                    <h4 className="text-xs font-bold text-slate-800 mb-1">عن المكان</h4>
                                    <p className="text-xs text-slate-600 leading-relaxed">{selectedVendor.description}</p>
                                </div>

                                {/* Contact Action Buttons */}
                                <div className="grid grid-cols-2 gap-2">
                                    <a 
                                        href={`https://wa.me/${selectedVendor.whatsapp}`}
                                        target="_blank"
                                        className="bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl py-2.5 flex items-center justify-center gap-1.5 text-xs font-bold"
                                    >
                                        <i data-lucide="message-circle" className="w-4 h-4"></i>
                                        تواصل واتساب
                                    </a>
                                    <a 
                                        href={`tel:${selectedVendor.phone}`}
                                        className="bg-blue-50 text-blue-700 border border-blue-200 rounded-xl py-2.5 flex items-center justify-center gap-1.5 text-xs font-bold"
                                    >
                                        <i data-lucide="phone" className="w-4 h-4"></i>
                                        اتصال بالمحل
                                    </a>
                                </div>

                                {/* Menu / Products Preview */}
                                {selectedVendor.menu && (
                                    <div>
                                        <h4 className="text-xs font-bold text-slate-800 mb-2">قائمة الأصناف / المنيو</h4>
                                        <div className="space-y-2">
                                            {selectedVendor.menu.map((item, idx) => (
                                                <div key={idx} className="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center">
                                                    <div>
                                                        <h5 className="text-xs font-bold text-slate-800">{item.name}</h5>
                                                        <p className="text-[10px] text-slate-500 mt-0.5">{item.desc}</p>
                                                    </div>
                                                    <span className="text-xs font-black text-burgundy whitespace-nowrap">{item.price}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* QR CODE DISCOUNT PASS MODAL */}
                    {showQRModal && selectedVendor && (
                        <div className="absolute inset-0 bg-black/70 backdrop-blur-sm z-40 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-5 w-full max-w-xs text-center space-y-4 shadow-2xl relative border-2 border-gold">
                                <button 
                                    onClick={() => setShowQRModal(false)}
                                    className="absolute top-3 left-3 text-slate-400 hover:text-slate-600"
                                >
                                    <i data-lucide="x" className="w-5 h-5"></i>
                                </button>

                                <div className="space-y-1">
                                    <span className="text-[10px] font-bold text-burgundy bg-burgundy-soft px-2.5 py-0.5 rounded-full">كارت خصم فعال</span>
                                    <h3 className="text-sm font-extrabold text-slate-800">{selectedVendor.name}</h3>
                                    <p className="text-xs text-gold-dark font-black">{selectedVendor.discount}</p>
                                </div>

                                {/* Simulated QR Code Box */}
                                <div className="bg-slate-50 p-4 rounded-2xl border-2 border-dashed border-slate-300 inline-block my-2">
                                    <img 
                                        src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=YJET-${selectedVendor.id}-8821`} 
                                        alt="Discount QR" 
                                        className="w-36 h-36 mx-auto rounded-lg"
                                    />
                                    <span className="block text-xs font-mono font-black text-slate-700 mt-2 tracking-widest">
                                        YJET-{selectedVendor.id}8821
                                    </span>
                                </div>

                                <p className="text-[11px] text-slate-500">أظهر هذا الكود للكاشير عند إتمام الطلب للحصول على الخصم فوراً</p>

                                <div className="bg-amber-50 text-amber-800 p-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
                                    <i data-lucide="clock" className="w-4 h-4 text-amber-600"></i>
                                    صلاحية الكود: {formatTime(timer)} دقيقة
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FIXED BOTTOM NAVIGATION BAR */}
                    <div className="absolute bottom-0 inset-x-0 bg-white border-t border-slate-200/80 px-3 py-2 flex justify-around items-center z-20 shadow-lg">
                        <button 
                            onClick={() => setActiveTab('home')}
                            className={`flex flex-col items-center gap-1 transition ${activeTab === 'home' ? 'text-burgundy' : 'text-slate-400'}`}
                        >
                            <i data-lucide="home" className="w-5 h-5"></i>
                            <span className="text-[10px] font-bold">الرئيسية</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('explore')}
                            className={`flex flex-col items-center gap-1 transition ${activeTab === 'explore' ? 'text-burgundy' : 'text-slate-400'}`}
                        >
                            <i data-lucide="compass" className="w-5 h-5"></i>
                            <span className="text-[10px] font-bold">استكشف</span>
                        </button>

                        {/* Floating Center Deals Button */}
                        <button 
                            onClick={() => setActiveTab('deals')}
                            className="w-12 h-12 rounded-full bg-burgundy text-gold shadow-lg flex items-center justify-center border-2 border-gold -mt-5 transition transform active:scale-95"
                        >
                            <i data-lucide="percent" className="w-6 h-6"></i>
                        </button>

                        <button 
                            onClick={() => setActiveTab('saved')}
                            className={`flex flex-col items-center gap-1 transition ${activeTab === 'saved' ? 'text-burgundy' : 'text-slate-400'}`}
                        >
                            <i data-lucide="heart" className="w-5 h-5"></i>
                            <span className="text-[10px] font-bold">المفضلة</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('profile')}
                            className={`flex flex-col items-center gap-1 transition ${activeTab === 'profile' ? 'text-burgundy' : 'text-slate-400'}`}
                        >
                            <i data-lucide="user" className="w-5 h-5"></i>
                            <span className="text-[10px] font-bold">حسابي</span>
                        </button>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
